executor: cluster-generic
cluster-generic-submit-cmd: >-
  mkdir -p logs/{rule} &&
  sbatch
  --partition={resources.partition}
  --cpus-per-task={threads}
  --mem={resources.mem_mb}
  --job-name=smk-{rule}-{wildcards.unique_id}
  --output=logs/{rule}/{rule}-{wildcards}-%j.out
  {resources.slurm_extra}
  --parsable

default-resources:
  - partition=cmmr
  - mem_mb=32000
  - slurm_extra=""

restart-times: 3
max-jobs-per-second: 20
max-status-checks-per-second: 10
local-cores: 1
latency-wait: 10
jobs: 30
keep-going: True
rerun-incomplete: True
printshellcmds: True
scheduler: greedy
use-conda: True
conda-prefix: /data/prod/snakemake_envs/hyb_asm_virome
