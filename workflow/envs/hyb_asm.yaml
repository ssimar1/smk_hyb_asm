name: hyb_asm_virome_hyb_asm
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # Assembly tools
  - spades >=3.15  # includes spades
  - checkv >=1.0

  # Sequence manipulation
  - seqkit
  - biopython

  # Alignment and mapping
  - minimap2
  - samtools
  - pysam

  # BLAST for community classification
  - blast >=2.12
  
  # Data processing
  - pandas
  - numpy